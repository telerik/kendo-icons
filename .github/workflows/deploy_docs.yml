# Publishes the docs for the current state of develop to the root of the gh-pages branch.
# PR previews live under /pr/<number>/ on the same branch (see build_icons.yml) and are preserved.
name: Deploy docs content to Pages

on:
  push:
    branches:
      - develop
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Serialize all writes to the gh-pages branch (shared with PR previews)
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:

  deploy:
    runs-on: ubuntu-latest

    # Separate from the built-in "github-pages" environment, which restricts deployment branches
    environment:
      name: docs
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          cache: 'npm'
          node-version: 24.x

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build --workspaces

      - name: Assemble site
        run: |
          mkdir -p site/telerik-icons
          cp docs/index.html site/
          cp -r packages/font-icons/dist site/font-icons
          cp -r packages/svg-icons/dist  site/svg-icons
          cp src/telerik-icons/icons.json     site/telerik-icons/
          cp src/telerik-icons/icon-list.json site/telerik-icons/

      - name: Deploy to gh-pages branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages 2>/dev/null || true
          git worktree add gh-pages-out origin/gh-pages 2>/dev/null || \
            git worktree add --orphan -B gh-pages gh-pages-out

          # Replace everything except PR previews
          find gh-pages-out -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'pr' -exec rm -rf {} +
          cp -r site/. gh-pages-out/

          cd gh-pages-out
          git add -A
          git commit -m "chore: deploy docs from ${GITHUB_SHA::7}" || echo "Nothing to commit"
          git push origin HEAD:gh-pages
